[project]
name = "guarded-browser-mcp"
version = "0.1.0"
description = "MCP server that drives a self-hosted Chromium with server-side guardrails: site allowlists, separate final-action tool, sensitive fields refused, isolated sessions"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = ["mcp>=2.3.0", "playwright>=1.48", "pyyaml>=6", "uvicorn>=0.30"]

[project.scripts]
guarded-browser-mcp = "guarded_browser_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["guarded_browser_mcp"]
