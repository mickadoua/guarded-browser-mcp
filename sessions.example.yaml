# One session = one access token, one browser context (cookies, logins), its site rules.
# Secret values never live here: only the names of the environment variables that hold them.
sessions:
  assistant:
    token_env: MCP_TOKEN_ASSISTANT        # token the MCP client sends as "Authorization: Bearer"
    cdp_url_env: CDP_URL_ASSISTANT        # CDP URL of this session's browser, secret path included
    policy: /app/policies/assistant.yaml
  shopping:
    token_env: MCP_TOKEN_SHOPPING
    cdp_url_env: CDP_URL_ASSISTANT        # same Chromium as "assistant"...
    isolated: true                        # ...in its own context, cookies saved to STATE_DIR/shopping.json
    policy: /app/policies/shopping.yaml
